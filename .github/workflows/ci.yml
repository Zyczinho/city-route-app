name: CI

on:
  pull_request:

# On main, Production rollout verification runs npm test + build + live checks
# in one runner instead of starting a second CI job for every merge.
concurrency:
  group: cityroute-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
