name: Live Nearby smoke

on:
  push:
    branches: [work/live-nearby-smoke]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check hosted Supabase Nearby RPC
        run: |
          node --input-type=module <<'NODE'
          import {SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY} from './supabase-config.js';

          const cases=[
            {city:'warsaw',lat:52.23184,lng:21.00699,label:'Warsaw centre'},
            {city:'krakow',lat:50.06143,lng:19.93658,label:'Kraków Rynek'}
          ];

          async function check({city,lat,lng,label}){
            const response=await fetch(`${SUPABASE_URL}/rest/v1/rpc/catalogue_nearby_places`,{
              method:'POST',
              headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'content-type':'application/json'},
              body:JSON.stringify({
                p_city_slug:city,
                p_lat:lat,
                p_long:lng,
                p_radius_m:500,
                p_max_results:50,
                p_category_ids:null
              })
            });
            const text=await response.text();
            if(!response.ok)throw new Error(`${label}: HTTP ${response.status} ${text}`);
            const rows=JSON.parse(text);
            if(!Array.isArray(rows)||rows.length===0)throw new Error(`${label}: expected at least one nearby place`);
            const ids=new Set();
            let previous=-1;
            for(const row of rows){
              if(typeof row.id!=='string'||!row.id)throw new Error(`${label}: missing public id`);
              if(ids.has(row.id))throw new Error(`${label}: duplicate id ${row.id}`);
              ids.add(row.id);
              const d=Number(row.dist_meters);
              if(!Number.isFinite(d)||d<0||d>500.5)throw new Error(`${label}: invalid distance for ${row.id}: ${row.dist_meters}`);
              if(d+0.01<previous)throw new Error(`${label}: results not sorted by distance`);
              previous=d;
            }
            console.log(JSON.stringify({city,label,count:rows.length,nearest:rows.slice(0,5).map(r=>({id:r.id,name:r.name,distance_m:Math.round(Number(r.dist_meters))}))},null,2));
          }

          for(const item of cases)await check(item);
          console.log('LIVE_NEARBY_SMOKE_OK');
          NODE
