name: Live Add Place diagnostic (no server writes)

on:
  pull_request:
    paths:
      - 'tests/add-place-live-smoke.mjs'
      - '.github/workflows/add-place-live-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-add-place-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-form:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium webkit
      - name: Inspect deployed CSS/PWA versions and click real production form
        run: node tests/add-place-live-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-add-place-diagnostic
          path: p0-smoke-artifacts/live-add-place/
          if-no-files-found: ignore
