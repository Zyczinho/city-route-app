name: Multi-city runtime codemod

on:
  push:
    branches: [work/multicity-runtime]

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/multicity-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-multicity-runtime.mjs
      - run: npm test
      - run: npm run build
      - name: Commit generated source refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "No generated app.js changes"
          else
            git commit -m "refactor: make runtime city-aware"
            git push origin HEAD:work/multicity-runtime
          fi
