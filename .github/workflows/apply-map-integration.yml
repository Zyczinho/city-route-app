name: Apply map integration patch

on:
  push:
    branches: [work/map-integrate-002]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/map-integrate-002
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-map-integration.mjs
      - run: npm test
      - run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js map-view.js map.css index.html scripts/build.mjs service-worker.js MAP_VIEW.md tests/map-integration.test.js
          git commit -m "feat: integrate interactive map and nearby runtime"
          git push origin HEAD:work/map-integrate-002
