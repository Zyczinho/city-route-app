name: P0 browser smoke

on:
  pull_request:
    paths:
      - 'app.js'
      - 'styles.css'
      - 'map.css'
      - 'map-view.js'
      - 'tests/map-view.test.js'
      - 'place-composer.js'
      - 'place-composer-model.js'
      - 'route-optimizer.js'
      - 'ux-cleanup.js'
      - 'social-routes-enhancements.js'
      - 'community-hub.js'
      - 'index.html'
      - 'service-worker.js'
      - 'tests/p0-browser-smoke.mjs'
      - '.github/workflows/p0-browser-smoke.yml'

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/p0-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-mobile-smoke-screenshots
          path: p0-smoke-artifacts/
          if-no-files-found: ignore
