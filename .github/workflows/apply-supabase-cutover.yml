name: Apply Supabase catalogue cutover

on:
  push:
    branches: [work/supabase-parity-cutover]

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/supabase-parity-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-supabase-catalogue-cutover.mjs
      - run: node scripts/check-live-supabase-parity.mjs
      - run: npm test
      - run: npm run build
      - name: Commit cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js service-worker.js
          if git diff --cached --quiet; then
            echo "Cutover already applied"
          else
            git commit -m "feat: load city catalogue from Supabase with JSON fallback"
            git push origin HEAD:work/supabase-parity-cutover
          fi
