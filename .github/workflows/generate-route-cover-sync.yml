name: Generate route cover sync

on:
  push:
    branches: [work/route-cover-sync-010]
    paths:
      - 'scripts/generate-route-cover-sync.mjs'
      - 'data/routes.json'
      - 'data/cities/**/routes.json'
      - '.github/workflows/generate-route-cover-sync.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/route-cover-sync-010
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate migration
        run: node scripts/generate-route-cover-sync.mjs
      - name: Commit generated migration
        run: |
          if [ -z "$(git status --porcelain -- supabase/migrations/010_sync_route_covers.sql)" ]; then
            echo "Migration already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/010_sync_route_covers.sql
          git commit -m "Generate route cover sync migration 010"
          git push origin HEAD:work/route-cover-sync-010
