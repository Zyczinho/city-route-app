name: Generate Krakow sync migration

on:
  push:
    branches: [work/krk-sync-002]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/krk-sync-002
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-city-import.mjs krakow 007
      - run: npm test
      - run: npm run build
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/007_sync_krakow_catalogue.sql
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: generate Krakow content sync migration"
            git push origin HEAD:work/krk-sync-002
          fi
