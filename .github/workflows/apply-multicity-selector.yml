name: Apply multi-city selector

on:
  push:
    branches: [work/krakow-selector-cutover]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/krakow-selector-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-multicity-selector.mjs
      - run: npm test
      - run: npm run build
      - name: Commit selector runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css service-worker.js scripts/check-live-supabase-parity.mjs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: enable Warsaw Krakow city selector"
            git push origin HEAD:work/krakow-selector-cutover
          fi
