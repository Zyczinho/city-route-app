name: Live Supabase catalogue parity

on:
  push:
    branches: [work/supabase-parity-cutover]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-live-supabase-parity.mjs
      - run: npm test
      - run: npm run build
