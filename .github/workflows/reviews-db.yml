name: City Route reviews database contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/016_cityroute_ratings_and_route_feedback.sql'
      - 'supabase/tests/016_fixture.sql'
      - 'supabase/tests/016_reviews.integration.sql'
      - '.github/workflows/reviews-db.yml'
permissions:
  contents: read
jobs:
  postgres-rls:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: city_route_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d city_route_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: city_route_test
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Seed isolated auth/place/route fixtures
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/016_fixture.sql
      - name: Apply migration 016
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/016_cityroute_ratings_and_route_feedback.sql
      - name: Assert rating separation, review permissions and private route-author feedback
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/016_reviews.integration.sql
      - name: Verify migration can run twice safely
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/016_cityroute_ratings_and_route_feedback.sql
