name: Check Krakow live parity

on:
  push:
    branches: [work/krakow-selector-cutover]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/krakow-selector-cutover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-live-supabase-parity.mjs krakow
      - run: npm test
      - run: npm run build
