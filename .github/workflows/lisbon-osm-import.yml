name: Lisbon OSM source snapshot (issue 148)

on:
  push:
    branches:
      - work/lisbon-osm-148
    paths:
      - scripts/import-lisbon-osm.mjs
      - .github/workflows/lisbon-osm-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lisbon-osm-import-148
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'Zyczinho/city-route-app' && github.ref == 'refs/heads/work/lisbon-osm-148'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lisbon-osm-148
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Retrieve a bounded Lisbon OpenStreetMap snapshot
        run: node scripts/import-lisbon-osm.mjs
      - name: Generate Lisbon-only Supabase import SQL
        run: node scripts/generate-city-import.mjs lisbon 021 --additive
      - name: Validate 100-200 real places and migration
        run: npm test
      - name: Validate production asset build
        run: npm run build
      - name: Check patch formatting
        run: git diff --check
      - name: Upload source and generated SQL for independent review
        uses: actions/upload-artifact@v4
        with:
          name: lisbon-osm-import-148
          path: |
            data/cities/lisbon/places.json
            data/cities/lisbon/import-report.json
            supabase/migrations/021_add_lisbon_osm_places.sql
      - name: Push verified dataset to the import branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities/lisbon/places.json data/cities/lisbon/import-report.json supabase/migrations/021_add_lisbon_osm_places.sql
          if git diff --cached --quiet; then
            echo "Verified snapshot already committed"
          else
            git commit -m "data(lisbon): verified OSM snapshot for beta (#148)"
            git push origin HEAD:work/lisbon-osm-148
          fi
