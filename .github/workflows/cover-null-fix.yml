name: Cover null fix
on:
  push:
    branches: [work/cover-wire-001]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/cover-wire-001
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-cover-null.mjs
      - run: npm test
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/cover-wiring.test.js
          git diff --cached --quiet && exit 0
          git commit -m "Handle routes without an available unique cover"
          git push origin HEAD:work/cover-wire-001
