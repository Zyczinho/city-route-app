name: tmp-builder-map-runtime
on:
  push:
    branches: [work/builder-map-runtime-004]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply builder-map runtime glue
        run: node scripts/patch-builder-map-runtime.mjs
      - name: Validate syntax
        run: node --check app.js
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit glue patch
        run: |
          git config user.name "city-route-runtime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.js service-worker.js tests/cover-wiring.test.js tests/map-integration.test.js tests/builder-runtime-wiring.test.js tests/builder-map-runtime.test.js
          git commit -m "feat: connect Route Builder draft to map runtime"
          git push
